<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple Hebrew reading tutorial. Learn Aleph and practice six Hebrew vowels.">
  <title>Aleph · Hebrew reading practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside>
    <label for="lessons">Lessons</label>
    <select id="lessons" size="22" aria-label="Lessons and timed practice">
      <option value="0" selected>Aleph</option>
      <option value="1">Kamatz, Patach, Segol</option>
      <option value="2">Tzere, Cherek, and Cholem</option>
      <option value="3">Combined</option>
      <option value="4" title="Sheva, Qibbutz, Shuruq, Cholem vav">Sheva, Qibbutz, Shuruq, Cholem vav</option>
      <option value="5">Combined</option>
      <option value="6">Bet</option>
      <option value="7">Bet practice</option>
      <option value="8">Vet</option>
      <option value="9">Vet practice</option>
      <option value="10">Gimel</option>
      <option value="11">Gimel practice</option>
      <option value="12">Dalet</option>
      <option value="13">Dalet practice</option>
      <option value="14">Heh</option>
      <option value="15">Heh practice</option>
      <option value="16">Two-letter practice</option>
      <option value="17">1 Syllable</option>
      <option disabled aria-hidden="true">────────────────────</option>
      <option value="slow">Slow</option>
      <option value="medium">Medium</option>
      <option value="fast">Fast</option>
    </select>
  </aside>
  <main>
    <section aria-label="Hebrew reading practice">
      <div class="toolbar"><button id="shuffle" hidden>↻ &nbsp; Shuffle</button><button id="show-previous" hidden>Show</button></div>
      <div id="practice" class="practice" aria-label="Hebrew practice area"></div>
      <div id="legend" class="legend"></div>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
